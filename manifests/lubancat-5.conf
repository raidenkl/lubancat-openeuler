# LubanCat 5 (RK3588) -- openEuler 24.03 LTS SP3, SBC-sig generic layout
ubootconfig=
bootmode=extlinux
local_uboot_dir=${nonfree_bin_dir}/u-boot/lubancat-5
dtb_name=rk3588-lubancat-5
platform=rockchip
soc_name=rk3588
arch=arm64
part_table=gpt
boot_size=256

POST_BOARD_OVERLAY() {
    echo "Put ${board} firmware into rootfs..."
    echo "alpha1: nothing to do"
}
