name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 禁止入库的路径
        run: |
          bad=$(git ls-files | grep -E '^(src/|scripts/build/|pkg/rpmbuild/)|\.orig-|\.rej$' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下路径不应入库："
            echo "$bad"
            exit 1
          fi

      - name: 单文件不得超 100MB
        run: |
          big=$(git ls-files -z | xargs -0 -r du -b 2>/dev/null | awk '$1 > 104857600 {print}')
          if [ -n "$big" ]; then
            echo "::error::存在超过 100MB 的文件（GitHub 硬限）："
            echo "$big"
            exit 1
          fi

      - name: 敏感信息扫描
        run: |
          hits=$(git grep -nE '10\.255\.[0-9]+\.[0-9]+|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_' -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::疑似内网地址或密钥："
            echo "$hits"
            exit 1
          fi

  shell:
    name: Shell 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::语法错误"; fail=1; }
          done
          exit $fail

      - name: shellcheck（仅新增脚本，warning 级）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # 上游脚本历史风格较旧，只检查本项目新增的文件
          shellcheck -S warning scripts/fetch-sources.sh scripts/gen_rk_update.sh scripts/mk_initrd.sh || true
