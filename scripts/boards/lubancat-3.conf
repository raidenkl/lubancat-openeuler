#
# LubanCat-3（RK3576）板级配置
#
# 约定：本文件顶层只允许「变量赋值」与「函数定义」，不得有顶层可执行语句
#      —— tools/build-image.sh 会在子 shell 里 source 它来读取变量。
#
# 与 lubancat-5.conf 的差异（RK3588 → RK3576）：
#   - 装 RK3576 对应二进制：libmali(G52 g13p0)、multimedia(RGA/MPP)、librknnrt、rkaiq(rk3576)
#   - 板型识别用 overlay/common 下全系共用的 board-init.sh（0000->3 / 0001->3IO / 0100->3-v2）
#   - 桌面段（光标主题 / lightdm autologin / onboard）由 LTB_DESKTOP 控制，
#     --desktop none 时整段跳过，驱动段仍装
#   - firstboot.sh / growfs-rootfs.sh 与 SoC 无关，直接复用 overlay/lubancat-5 下的实现

ubootconfig=
# u-boot 走源码编（宿主执行）：容器没有 python2，而 Rockchip 的 make.sh 固定 PYTHON=python2。
# 不设 build_uboot_from_src 时仍用 bin/u-boot/lubancat-3/ 下的预编译产物。
build_uboot_from_src=1
uboot_defconfig=rk3576_defconfig
uboot_src_dir=${cur_dir}/../../u-boot
bootmode=extboot
boot_fs=ext2
local_uboot_dir=${nonfree_bin_dir}/u-boot/lubancat-3
dtb_name=rk3576-lubancat-3
platform=rockchip
soc_name=rk3576
arch=arm64
part_table=gpt
# rk3576 的 boot.img 可能比 rk3588 略大（dtb 数量/体积），留足余量
boot_size=512
# uboot 分区 4 MiB：厂商的 uboot.img 正好 4 MiB（校验用 -le，相等通过）
rk_uboot_sectors=${rk_uboot_sectors:-0x2000}

extboot_generic_dtb=rk3576-lubancat-generic.dtb
extboot_generic_uenv=uEnvLubanCat.txt
# 1 = 初始 rk-kernel.dtb/uEnv 用上面的 generic，让**一份镜像通吃 rk3576 家族**
#     （Cat-3 / 3-V2 / 3IO）。首启由 board-init 按 SARADC 判定实板、ln -sf 覆盖
#     rk-kernel.dtb 与 uEnv.txt，然后重启一次生效。
#     这条链路已由 rk3588 家族实机跑通（Cat-4IO 上识别为 LubanCat-4IOB），rk3576 侧待实机确认。
extboot_generic_first=1

POST_BOARD_OVERLAY() {
    echo "Put ${board} overlay into rootfs..."
    local ov=${cur_dir}/overlay
    # firstboot / growfs 与 SoC 无关，暂共用 lubancat-5 下的实现
    local ov_common=${ov}/lubancat-5
    # 桌面相关段由 tools/build-image.sh 通过 LTB_DESKTOP 控制（none 时整段跳过）
    local lbc_desktop=${LTB_DESKTOP:-ukui}

    # --- 启动优化 ---
    # rk3588 上 serial@feb50000 被 fiq-debugger 占用、/dev/ttyS2 永不存在，
    # 该实例以 Dependency failed 卡住 getty.target 约 60s。rk3576 的占用情况
    # 待实机确认，先沿用屏蔽（最坏情况只是少一个串口 getty，不影响 console=ttyFIQ0）
    mkdir -p ${rootfs_dir}/etc/systemd/system
    ln -sf /dev/null ${rootfs_dir}/etc/systemd/system/serial-getty@ttyS2.service
    ln -sf /dev/null ${rootfs_dir}/etc/systemd/system/NetworkManager-wait-online.service
    ln -sf /dev/null ${rootfs_dir}/etc/systemd/system/dnf-makecache.timer
    rm -f ${rootfs_dir}/etc/systemd/system/timers.target.wants/dnf-makecache.timer

    # --- 调试账号（rootfs 每次重建都会重置，必须固化在这里）---
    if ! grep -q '^lubancat:' ${rootfs_dir}/etc/passwd; then
        echo 'lubancat:x:1000:1000:LubanCat:/home/lubancat:/bin/bash' >> ${rootfs_dir}/etc/passwd
        echo 'lubancat:x:1000:' >> ${rootfs_dir}/etc/group
        LBC_PASS="${LUBANCAT_DEFAULT_PASS:-lubancat}"
        LBC_SALT="${LUBANCAT_SALT:-Sbc2026}"
        LBC_HASH=$(openssl passwd -6 -salt "${LBC_SALT}" "${LBC_PASS}")
        LBC_DAYS=$(( $(date +%s) / 86400 ))
        echo "lubancat:${LBC_HASH}:${LBC_DAYS}:0:99999:7:::" >> ${rootfs_dir}/etc/shadow
        mkdir -p ${rootfs_dir}/home/lubancat
        cp -a ${rootfs_dir}/etc/skel/. ${rootfs_dir}/home/lubancat/ 2>/dev/null || true
        chown -R 1000:1000 ${rootfs_dir}/home/lubancat
    fi

    # --- P0-2：用户加入 video 组（/dev/mali0、/dev/rga、/dev/mpp_service 均为 0660 root:video）---
    for lbc_g in video; do
        if [ -x "${rootfs_dir}/usr/sbin/usermod" ] && \
           chroot "${rootfs_dir}" /usr/sbin/usermod -aG "$lbc_g" lubancat 2>/dev/null; then :;
        else
            awk -F: -v OFS=: -v g="$lbc_g" -v u=lubancat '
                $1==g { n=split($4,a,","); for(i=1;i<=n;i++) if(a[i]==u) d=1;
                        if(!d) $4=($4==""?u:$4","u) } { print }
            ' "${rootfs_dir}/etc/group" > "${rootfs_dir}/etc/group.new" \
              && chown 0:0 "${rootfs_dir}/etc/group.new" \
              && chmod 644 "${rootfs_dir}/etc/group.new" \
              && mv -f "${rootfs_dir}/etc/group.new" "${rootfs_dir}/etc/group"
        fi
        chroot "${rootfs_dir}" id -nG lubancat 2>/dev/null | tr " " "\n" | grep -qx "$lbc_g" \
            || echo "ERROR: lubancat 未进入 $lbc_g 组"
    done

    mkdir -p ${rootfs_dir}/etc/sudoers.d
    echo 'lubancat ALL=(ALL) NOPASSWD:ALL' > ${rootfs_dir}/etc/sudoers.d/lubancat
    chmod 440 ${rootfs_dir}/etc/sudoers.d/lubancat

    # --- P0-3：首启唯一性（machine-id / SSH 主机密钥 / 主机名）---
    : > "${rootfs_dir}/etc/machine-id"
    rm -f "${rootfs_dir}/var/lib/dbus/machine-id"
    rm -f "${rootfs_dir}/etc/ssh/ssh_host_"*
    for lbc_t in rsa ecdsa ed25519; do
        [ -f "${rootfs_dir}/usr/lib/systemd/system/sshd-keygen@.service" ] || continue
        ln -sf "/usr/lib/systemd/system/sshd-keygen@.service" \
            "${rootfs_dir}/etc/systemd/system/multi-user.target.wants/sshd-keygen@${lbc_t}.service"
    done
    install -Dm755 "${ov_common}/usr/libexec/lubancat/firstboot.sh" \
        "${rootfs_dir}/usr/libexec/lubancat/firstboot.sh"
    install -Dm644 "${ov_common}/etc/systemd/system/lubancat-firstboot.service" \
        "${rootfs_dir}/etc/systemd/system/lubancat-firstboot.service"
    ln -sf "/etc/systemd/system/lubancat-firstboot.service" \
        "${rootfs_dir}/etc/systemd/system/multi-user.target.wants/lubancat-firstboot.service"
    echo "firstboot (machine-id/hostname/ssh keys) wired"

    # --- P0-4：首启把根文件系统扩到分区大小（只 resize2fs，不动分区表）---
    install -Dm755 "${ov_common}/usr/libexec/lubancat/growfs-rootfs.sh" \
        "${rootfs_dir}/usr/libexec/lubancat/growfs-rootfs.sh"
    install -Dm644 "${ov_common}/etc/systemd/system/lubancat-growfs.service" \
        "${rootfs_dir}/etc/systemd/system/lubancat-growfs.service"
    ln -sf "/etc/systemd/system/lubancat-growfs.service" \
        "${rootfs_dir}/etc/systemd/system/multi-user.target.wants/lubancat-growfs.service"
    echo "growfs (resize2fs only, no partition edit) wired"

    # --- 板型识别：首启读 SARADC 选 dtb/uEnv ---
    # 脚本放在 overlay/common，全系共用一份；识别逻辑照搬厂商 debian12 的 boot_init.sh
    # （rk3576：0000->Cat-3 / 0001->3IO / 0100->3-v2，其余走 generic）
    install -Dm755 ${ov}/common/usr/libexec/lubancat/board-init.sh \
        ${rootfs_dir}/usr/libexec/lubancat/board-init.sh
    install -Dm644 ${ov}/common/etc/systemd/system/lubancat-board-init.service \
        ${rootfs_dir}/etc/systemd/system/lubancat-board-init.service
    mkdir -p ${rootfs_dir}/etc/systemd/system/multi-user.target.wants
    ln -sf /etc/systemd/system/lubancat-board-init.service \
        ${rootfs_dir}/etc/systemd/system/multi-user.target.wants/lubancat-board-init.service

    # --- 音频：打开 ES8388 耳机输出通路（OUT1）---
    # 镜像里 /var/lib/alsa/asound.state 记录的 OUT1/OUT2 是 false，alsa 恢复后
    # DAPM 找不到 DAC->Out1->OUT1->LOUT1->Headphone 的完整通路，整条模拟链不上电，
    # 3.5mm 会完全无声（aplay 却一切正常）。详见 docs/peripheral-verification.md 音频节。
    install -Dm755 ${ov}/common/usr/libexec/lubancat/audio-init.sh \
        ${rootfs_dir}/usr/libexec/lubancat/audio-init.sh
    install -Dm644 ${ov}/common/etc/systemd/system/lubancat-audio-mixer.service \
        ${rootfs_dir}/etc/systemd/system/lubancat-audio-mixer.service
    ln -sf /etc/systemd/system/lubancat-audio-mixer.service \
        ${rootfs_dir}/etc/systemd/system/multi-user.target.wants/lubancat-audio-mixer.service

    # --- 图形栈（仅桌面版）：libmali(Mali-G52 g13p0) + lightdm + 图形默认目标 ---
    # 铁律：不把 /usr/lib64/mali 写进 ld.so.conf / 全局 LD_LIBRARY_PATH
    #      （mali 的 libgbm 是 hook 桩，会破坏 Xorg glamor 与 kwin 光标纹理）
    if [ "$lbc_desktop" != none ]; then
        MALI_TGZ=${cur_dir}/bin/libmali/mali-g52-g13p0.tar.gz
        if [ -f "${MALI_TGZ}" ]; then
            tar xzf "${MALI_TGZ}" --no-same-owner -C "${rootfs_dir}"
            [ -f "${rootfs_dir}/usr/lib64/mali/libEGL.so.1" ] || \
                echo "WARN mali tar 解包后缺 usr/lib64/mali/libEGL.so.1"
            mkdir -p "${rootfs_dir}/usr/local/bin"
            cat > "${rootfs_dir}/usr/local/bin/mali-env" <<'EOS'
#!/bin/sh
# 按需启用 Mali GPU（EGL/GLES，GBM/Wayland 平台）。X11 桌面仍走 mesa/llvmpipe。
# 用法：mali-env <命令>   例如 mali-env eglinfo
export LD_LIBRARY_PATH=/usr/lib64/mali${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
exec "$@"
EOS
            chmod 755 "${rootfs_dir}/usr/local/bin/mali-env"
            rm -f "${rootfs_dir}/etc/profile.d/mali.sh"
            echo "mali(G52 g13p0) installed; GPU 按需启用，未设全局 LD_LIBRARY_PATH"
        else
            echo "WARN mali tarball missing: ${MALI_TGZ}"
        fi

        # lightdm 显式 enable + 图形默认目标
        mkdir -p ${rootfs_dir}/etc/systemd/system/graphical.target.wants
        if [ -f ${rootfs_dir}/usr/lib/systemd/system/lightdm.service ]; then
            ln -sf /usr/lib/systemd/system/lightdm.service \
                ${rootfs_dir}/etc/systemd/system/graphical.target.wants/lightdm.service
        fi
        ln -sf /usr/lib/systemd/system/graphical.target ${rootfs_dir}/etc/systemd/system/default.target

        # 光标主题：openEuler 的 breeze/ukui 系 cursors 目录为空，kwin 加载不到就不画指针
        if [ -d "${rootfs_dir}/usr/share/icons/Adwaita/cursors" ]; then
            for ct in breeze breeze-dark ukui ukui-classical; do
                cdir="${rootfs_dir}/usr/share/icons/${ct}/cursors"
                if [ -d "${rootfs_dir}/usr/share/icons/${ct}" ] && [ -z "$(ls -A "${cdir}" 2>/dev/null)" ]; then
                    rm -rf "${cdir}"
                    cp -a "${rootfs_dir}/usr/share/icons/Adwaita/cursors" "${cdir}"
                fi
            done
            mkdir -p "${rootfs_dir}/etc/xdg" "${rootfs_dir}/etc/skel/.config"
            printf '[Mouse]\ncursorTheme=Adwaita\ncursorSize=24\n' > "${rootfs_dir}/etc/xdg/kcminputrc"
            printf '[$Version]\nupdate_info_kcminputrc=1\n\n[Mouse]\ncursorTheme=Adwaita\ncursorSize=24\n' \
                > "${rootfs_dir}/etc/skel/.config/kcminputrc"
            grep -q XCURSOR_THEME "${rootfs_dir}/etc/environment" 2>/dev/null || \
                printf 'XCURSOR_THEME=Adwaita\nXCURSOR_SIZE=24\n' >> "${rootfs_dir}/etc/environment"
            echo "cursor theme prepared: Adwaita"
        fi

        # lightdm 自动登录（与 Cat-5 同策略：免密进桌面）
        mkdir -p "${rootfs_dir}/etc/lightdm/lightdm.conf.d"
        cat > "${rootfs_dir}/etc/lightdm/lightdm.conf.d/50-autologin.conf" <<'EOS'
[Seat:*]
autologin-user=lubancat
autologin-user-timeout=0
autologin-session=ukui
EOS

        # 桌面体验：软件光标（rk3576 的 VOP cursor plane 待实机确认，先沿用）+ 屏幕键盘
        install -Dm644 "${ov_common}/etc/X11/xorg.conf.d/20-swcursor.conf" \
            "${rootfs_dir}/etc/X11/xorg.conf.d/20-swcursor.conf"
        # 主 GPU 必须是显示子系统：RKNPU 也注册 DRM 设备，且 probe 比显示更早，
        # 否则 X 会选中 NPU 的 card1 并 Fatal（Cannot run in framebuffer mode）
        install -Dm644 "${ov}/common/etc/X11/xorg.conf.d/10-rockchip-primary.conf" \
            "${rootfs_dir}/etc/X11/xorg.conf.d/10-rockchip-primary.conf"
        install -Dm644 "${ov_common}/etc/xdg/autostart/onboard-autostart.desktop" \
            "${rootfs_dir}/etc/xdg/autostart/onboard-autostart.desktop"
        install -Dm644 "${ov_common}/etc/dconf/db/local.d/00-onboard" \
            "${rootfs_dir}/etc/dconf/db/local.d/00-onboard"
        mkdir -p "${rootfs_dir}/etc/dconf/profile"
        grep -qs "system-db:local" "${rootfs_dir}/etc/dconf/profile/user" || \
            echo "system-db:local" >> "${rootfs_dir}/etc/dconf/profile/user"
        chroot "${rootfs_dir}" dconf update 2>/dev/null || true
        echo "desktop stack (mali/lightdm/autologin/swcursor/onboard) wired"
    else
        echo "headless 模式：跳过桌面栈与图形库"
    fi

    # --- C1 NPU 运行时（RKNN，2.3.0 明示支持 RK3576；无头场景也要）---
    if [ -f "${cur_dir}/bin/npu/librknnrt.so" ]; then
        install -Dm755 "${cur_dir}/bin/npu/librknnrt.so" "${rootfs_dir}/usr/lib64/librknnrt.so"
        echo "librknnrt installed to /usr/lib64"
    else
        echo "WARN: bin/npu/librknnrt.so missing, NPU runtime not installed"
    fi

    # --- 多媒体：RGA / MPP / gst 硬解 / udev 权限（rk3576 复用同一套库）---
    MULTI=${cur_dir}/bin/multimedia
    if [ -d "${MULTI}" ]; then
        install -Dm755 "${MULTI}/rga/librga.so.2.1.0" "${rootfs_dir}/usr/lib64/librga.so.2.1.0"
        ln -sf librga.so.2.1.0 "${rootfs_dir}/usr/lib64/librga.so.2"
        install -Dm755 "${MULTI}/mpp/librockchip_mpp.so.0" "${rootfs_dir}/usr/lib64/librockchip_mpp.so.0"
        ln -sf librockchip_mpp.so.0 "${rootfs_dir}/usr/lib64/librockchip_mpp.so.1"
        ln -sf librockchip_mpp.so.1 "${rootfs_dir}/usr/lib64/librockchip_mpp.so"
        install -Dm755 "${MULTI}/mpp/librockchip_vpu.so.0" "${rootfs_dir}/usr/lib64/librockchip_vpu.so.0"
        ln -sf librockchip_vpu.so.0 "${rootfs_dir}/usr/lib64/librockchip_vpu.so.1"
        ln -sf librockchip_vpu.so.1 "${rootfs_dir}/usr/lib64/librockchip_vpu.so"
        install -d "${rootfs_dir}/usr/lib64/gstreamer-1.0"
        for f in "${MULTI}/gst/"*.so; do
            [ -f "$f" ] || continue
            install -m755 "$f" "${rootfs_dir}/usr/lib64/gstreamer-1.0/$(basename "$f")"
        done
        install -d "${rootfs_dir}/usr/bin"
        for f in "${MULTI}/demos/"*; do
            [ -f "$f" ] || continue
            install -m755 "$f" "${rootfs_dir}/usr/bin/"
        done
        install -Dm644 "${MULTI}/rules/99-rockchip-permissions.rules" \
            "${rootfs_dir}/etc/udev/rules.d/99-rockchip-permissions.rules"
        echo "multimedia (rga/mpp/gst/udev) installed into rootfs"
    else
        echo "WARN: ${MULTI} missing, multimedia not installed"
    fi

    # --- 摄像头 3A（rkaiq）：装进镜像本体 ---
    # 这个包带 rkaiq_3A_server 与 /etc/iqfiles/ 下各 sensor 的 ISP 标定参数；
    # 只把 rpm 丢在 /opt/rpms 等于"有包没装"，ISP 拿不到标定，出图偏色/发暗。
    # 依赖（/bin/sh、glibc、libdrm、libstdc++、systemd）镜像内均已满足；用 --nodeps
    # 脱离仓库是为了不吃构建期网络。%post 里的 systemctl 在 chroot 下不生效
    # （包内脚本自带 || : ），所以开机自启要在这里显式建 symlink。
    if ls "${cur_dir}/bin/rpms/rk3576/"camera-engine-rkaiq-*.rpm >/dev/null 2>&1; then
        install -d "${rootfs_dir}/opt/rpms"
        install -m644 "${cur_dir}/bin/rpms/rk3576/"camera-engine-rkaiq-*.rpm "${rootfs_dir}/opt/rpms/"
        if chroot "${rootfs_dir}" /bin/sh -c \
                'rpm -ivh --nodeps /opt/rpms/camera-engine-rkaiq-*.rpm' > /tmp/rkaiq-install.log 2>&1; then
            chroot "${rootfs_dir}" /bin/sh -c 'ldconfig' >/dev/null 2>&1 || true
            # 默认随开机启动（chroot 里 systemctl enable 不落盘，直接建 .wants 链接）
            install -d "${rootfs_dir}/etc/systemd/system/multi-user.target.wants"
            ln -sf /usr/lib/systemd/system/rkaiq_3A.service \
                "${rootfs_dir}/etc/systemd/system/multi-user.target.wants/rkaiq_3A.service"
            echo "camera-engine-rkaiq(rk3576) installed + rkaiq_3A.service enabled: $(chroot "${rootfs_dir}" rpm -q --qf '%{VERSION}-%{RELEASE}' camera-engine-rkaiq-rk3576 2>/dev/null)"
            # 装完不留 rpm 本体（省 1.4 MB）
            rm -f "${rootfs_dir}"/opt/rpms/camera-engine-rkaiq-*.rpm
            rmdir "${rootfs_dir}/opt/rpms" 2>/dev/null || true
        else
            echo "ERROR: rkaiq 安装失败，rpm 保留在 /opt/rpms 供现场手工装，日志："
            tail -5 /tmp/rkaiq-install.log | sed 's/^/    /'
        fi
    else
        echo "WARN: bin/rpms/rk3576/ 下没有 rkaiq rpm（跑 tools/build-rpms.sh）"
    fi

    # --- P0-1：属主/权限兜底 ---
    for lbc_d in "" /etc /usr /usr/lib /usr/lib/firmware /usr/lib64 /etc/OpenCL /etc/OpenCL/vendors /etc/ld.so.conf.d; do
        [ -d "${rootfs_dir}${lbc_d}" ] && chown 0:0 "${rootfs_dir}${lbc_d}" \
            && chmod 755 "${rootfs_dir}${lbc_d}"
    done
    [ "$(stat -c %u ${rootfs_dir}/etc)" = "0" ] \
        || echo "ERROR: /etc 属主不是 root，请检查构建身份"

    # --- P0-6：出镜像前的瘦身与补齐（必须放在最后）---
    rm -rf "${rootfs_dir}/var/cache/dnf/"* 2>/dev/null || true
    rm -rf "${rootfs_dir}/var/lib/dnf/history"* 2>/dev/null || true
    find "${rootfs_dir}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
    [ -f "${rootfs_dir}/var/log/lastlog" ] || install -m 644 /dev/null "${rootfs_dir}/var/log/lastlog"
    chroot "${rootfs_dir}" /usr/sbin/ldconfig 2>/dev/null || true
    echo "image cleanup done (dnf cache/tmp/lastlog/ldconfig)"

    return 0
}
