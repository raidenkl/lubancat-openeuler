# 将 ALSA default 设备路由到 PulseAudio。
#
# 背景（LubanCat-5 alpha6 实测）：ukui-session-manager 用裸 aplay 播放登录音
# （/usr/share/ukui/ukui-session-manager/startup.wav），与 pulseaudio --start
# 在同一秒启动；aplay 走 default 直连 hw 设备，被持有声卡的 pulseaudio 阻塞，
# 挂死在 snd_pcm_write（/proc 里停在 do_sys_poll，曾持续 1h50m）。
#
# 走 pulse 后所有客户端汇入同一音频栈，不再发生 hw 独占冲突。
# 注意：pulseaudio 未运行时（如纯 SSH 场景），alsa-pulse 插件会尝试 autospawn；
# 硬件级排障请显式指定 -D hw:0,0 或 hw:1,0。
pcm.!default {
    type pulse
    hint { show on description "Default (via PulseAudio)" }
}
ctl.!default {
    type pulse
}
