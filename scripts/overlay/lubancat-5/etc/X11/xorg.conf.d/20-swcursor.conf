# RK3588 + rockchip-drm：VOP 的 cursor plane 在 DSI 面板上不稳定。
# 实测现象：鼠标移到任务栏触发面板重绘后，指针消失且不再恢复，
# 但 X 侧光标状态一直正常（XFixes 读到 24x24 "default"），说明是
# "没画出来"而不是"被设成空白"。
#
# 该平台 glamor 初始化失败（Refusing to try glamor on llvmpipe），
# X 直接渲染到扫描缓冲区，没有 shadow framebuffer，因此改用软件光标
# 最稳：由 X 自己把光标画进扫描缓冲区，不再依赖 DRM cursor plane。
Section "Device"
    Identifier "Rockchip"
    Driver     "modesetting"
    Option     "SWcursor" "on"
EndSection
